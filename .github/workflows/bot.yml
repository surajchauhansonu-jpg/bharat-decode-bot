name: Bharat Decode Bot

on:
  schedule:
    - cron: "*/30 0-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Time-window ignore karke abhi chalao (1)"
        default: "0"

concurrency:
  group: bharat-decode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Hindi text shaping libs
        run: sudo apt-get update && sudo apt-get install -y libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python main.py
        env:
          FORCE: ${{ github.event.inputs.force }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SOURCE_FB_PAGE_ID: "100095141476402"
          SOURCE_FB_ACCESS_TOKEN: ${{ secrets.SOURCE_FB_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: "v26.0"
      - name: Save seen.json
        if: always()
        run: |
          git config user.name "bharat-decode-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase && git push)
